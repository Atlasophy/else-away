<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>elseaway — Studio</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <!-- Bump this asset version whenever Studio CSS or JavaScript changes. -->
  <link rel="stylesheet" href="/admin/admin.css?v=20261014.2">
  <script src="/copy-fields.js?v=20261014.2" defer></script>
  <script src="/admin/admin.js?v=20261014.2" type="module" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to the editor</a>

  <header class="bar">
    <span class="wordmark">elseaway<i>°</i></span>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-view="about" aria-current="true">About me</button>
      <button type="button" class="tab" data-view="writing">Site writing</button>
      <button type="button" class="tab" data-view="details">Details</button>
      <button type="button" class="tab" data-view="collaborations">Collaborations</button>
      <button type="button" class="tab" data-view="postcards">Postcards</button>
      <button type="button" class="tab" data-view="photos">Photographs</button>
    </nav>
    <div class="bar-actions">
      <p class="status" role="status" data-status></p>
      <button type="button" class="publish" data-publish disabled>Publish</button>
    </div>
  </header>

  <main id="workspace" class="workspace" data-workspace>
    <p class="loading">Opening your studio…</p>
  </main>

  <div class="dialog-backdrop" data-picker hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="dialog-head">
        <h2 id="picker-title">Choose a photograph</h2>
        <button type="button" class="ghost" data-picker-close>Close</button>
      </div>
      <label class="upload">
        <input type="file" accept="image/*" multiple data-upload-input>
        <span class="upload-action" data-upload-action>Choose &amp; upload photographs</span>
        <span class="upload-title">From your computer</span>
        <small>Upload starts automatically after you choose. Large photographs are resized before they are sent.</small>
      </label>
      <button type="button" class="reconnect" data-reconnect hidden>Reload Studio to reconnect</button>
      <div class="picker-grid" data-picker-grid></div>
    </div>
  </div>
</body>
</html>
